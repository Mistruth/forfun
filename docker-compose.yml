services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-wyd520}"
      SESSION_SECRET: "${SESSION_SECRET:-replace-with-random-long-secret}"
      DATA_DIR: "/data"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-8}"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
